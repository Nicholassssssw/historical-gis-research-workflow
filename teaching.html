<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="歷史地理資訊研究八步工作流程的教學說明。">
  <title>教學說明｜歷史地理資訊研究</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&amp;family=Ma+Shan+Zheng&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="teaching-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-seal" aria-hidden="true">輿</span><span><strong>歷史地理資訊研究</strong><small>八步工作流程</small></span></a>
      <nav class="page-nav" aria-label="頁面選單"><a href="index.html">工作流程</a><a class="active" href="teaching.html">教學說明</a></nav>
    </div>
  </header>
  <main>
    <section class="hero teaching-hero"><div class="hero-copy"><p class="eyebrow">Interactive Teaching · 互動研習</p><h1>八步互動教學</h1><p>跟隨卡片逐步建立研究 Prompt。閱讀動態教學內容、完成題目，答對後便可解鎖下一步。</p></div></section>
    <div class="ornamental-divider" aria-hidden="true"><span>◆</span></div>

    <section class="lesson-progress" aria-label="教學進度">
      <div class="lesson-progress-copy"><span>研習進度</span><strong id="lesson-progress-label">步驟一／八</strong></div>
      <div class="lesson-progress-track" role="progressbar" aria-label="教學完成進度" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"><span id="lesson-progress-bar" style="width: 12.5%"></span></div>
    </section>

    <section class="lesson-deck" id="lesson-deck" aria-label="互動教學卡片">
      <article class="lesson-card" id="lesson-card">
        <header class="lesson-card-header">
          <div><span class="lesson-kicker" id="lesson-kicker">步驟一</span><h2 id="lesson-title">抽地名</h2></div>
          <span class="lesson-number" id="lesson-number" aria-hidden="true">壹</span>
        </header>

        <section class="lesson-intro-panel" id="lesson-intro-panel" hidden>
          <p class="lesson-intro-text" id="lesson-intro-text"></p>
          <button class="lesson-start-button" id="lesson-start-button" type="button">開始</button>
        </section>

        <div class="lesson-workspace">
          <div class="lesson-screen" aria-live="polite">
            <div class="screen-toolbar"><span class="screen-label">動態教學</span></div>
            <div class="typewriter-output"><p class="typewriter-text" id="typewriter-text"></p><span class="typing-cursor" id="typing-cursor" aria-hidden="true"></span></div>

            <section class="generated-prompt-panel" id="generated-prompt-panel" hidden>
              <header><div><span>已完成</span><strong>本步驟 Prompt 可直接複製</strong></div><button class="lesson-copy-button" id="lesson-copy-button" type="button">複製 Prompt</button></header>
              <textarea class="generated-prompt-text" id="generated-prompt-text" readonly aria-label="已生成的可複製 Prompt"></textarea>
            </section>
          </div>

          <fieldset class="lesson-question" id="lesson-question" hidden>
            <legend id="question-legend"></legend>
            <div id="question-options"></div>
            <div class="answer-row"><button class="answer-button" id="answer-button" type="button">提交答案</button><p class="answer-feedback" id="answer-feedback" aria-live="polite"></p></div>
          </fieldset>
        </div>

        <footer class="lesson-card-footer" id="lesson-card-footer">
          <button class="lesson-nav-button" id="previous-step" type="button" disabled>← 上一步</button>
          <span id="lesson-nav-hint">完成題目後解鎖下一步</span>
          <button class="lesson-nav-button lesson-nav-next" id="next-step" type="button" disabled>下一步 →</button>
        </footer>
      </article>
    </section>
  </main>
  <footer><p><span aria-hidden="true">輿</span><strong>方法提示</strong>　所有推算都應保存證據鏈、判斷原因與不確定性。</p></footer>
  <script src="teaching-content.js"></script>
  <script src="teaching.js"></script>
</body>
</html>
